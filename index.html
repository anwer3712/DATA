<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>八字排盤（修正版）</title>
    <!-- 若 CDN 失效，可自行下載 lunar.min.js 放到同資料夾，並改用本地路徑 -->
    <script src="https://unpkg.com/lunar-typescript@1.6.11/dist/lunar.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            padding: 20px;
            max-width: 420px;
            margin: auto;
            background: #f9f9f9;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #333; }
        label { font-weight: bold; margin-top: 10px; display: block; color: #555; }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0 20px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #45a049; }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: #e7f3fe;
            border-left: 6px solid #2196F3;
            display: none;
        }
        #baziText {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            text-align: center;
            color: #333;
        }
        .copy-btn { background: #2196F3; margin-top: 10px; }
        .copy-btn:hover { background: #0b7dda; }
    </style>
</head>
<body>

<div class="container">
    <h2>八字排盤</h2>

    <label>西元年：</label>
    <input type="number" id="year" placeholder="1990" min="1900" max="2100">

    <label>月（1-12）：</label>
    <input type="number" id="month" placeholder="6" min="1" max="12">

    <label>日（1-31）：</label>
    <input type="number" id="day" placeholder="15" min="1" max="31">

    <label>時辰（0-23，23點為次日子時）：</label>
    <select id="hourSelect">
        <option value="-1">未知（不影響日柱）</option>
        <option value="0">0 時（子時）</option>
        <option value="1">1 時（丑時）</option>
        <option value="2">2 時（丑時）</option>
        <option value="3">3 時（寅時）</option>
        <option value="4">4 時（寅時）</option>
        <option value="5">5 時（卯時）</option>
        <option value="6">6 時（卯時）</option>
        <option value="7">7 時（辰時）</option>
        <option value="8">8 時（辰時）</option>
        <option value="9">9 時（巳時）</option>
        <option value="10">10 時（巳時）</option>
        <option value="11">11 時（午時）</option>
        <option value="12">12 時（午時）</option>
        <option value="13">13 時（未時）</option>
        <option value="14">14 時（未時）</option>
        <option value="15">15 時（申時）</option>
        <option value="16">16 時（申時）</option>
        <option value="17">17 時（酉時）</option>
        <option value="18">18 時（酉時）</option>
        <option value="19">19 時（戌時）</option>
        <option value="20">20 時（戌時）</option>
        <option value="21">21 時（亥時）</option>
        <option value="22">22 時（亥時）</option>
        <option value="23">23 時（子時）</option>
    </select>

    <button onclick="calculateBazi()">開始排盤</button>

    <div id="result">
        <p style="text-align: center; margin: 0; color: #666;">您的八字四柱：</p>
        <p id="baziText"></p>
        <button class="copy-btn" onclick="copyBazi()">一鍵複製</button>
    </div>
</div>

<script>
    function calculateBazi() {
        const y = parseInt(document.getElementById('year').value);
        const m = parseInt(document.getElementById('month').value);
        const d = parseInt(document.getElementById('day').value);
        const hourVal = parseInt(document.getElementById('hourSelect').value);

        if (isNaN(y) || isNaN(m) || isNaN(d)) {
            alert('請完整填寫年月日');
            return;
        }
        if (m < 1 || m > 12 || d < 1 || d > 31) {
            alert('月份或日期超出範圍');
            return;
        }

        let hour = 12;           // 預設中午
        let useNextDay = false;  // 是否要用次日計算日柱（給時柱用）

        if (hourVal === -1) {
            // 未知時辰，時柱標記「未知」，保留預設午時計算其他柱
        } else if (hourVal === 23) {
            // 23 點屬次日子時 → 日期加一天，時辰視為 0
            hour = 0;
            useNextDay = true;
        } else if (hourVal >= 0 && hourVal <= 22) {
            hour = hourVal;
        } else {
            alert('無效的時辰');
            return;
        }

        // 計算日柱用的日期（若子時換日則加一天）
        let solar;
        try {
            if (useNextDay) {
                // 先構造原日期的次日
                const tmpSolar = Solar.fromYmd(y, m, d);
                const next = tmpSolar.next(1); // 取得次日 Solar 物件
                // 用次日重新建立帶時辰的物件（0點）
                solar = Solar.fromYmdH(next.getYear(), next.getMonth(), next.getDay(), 0);
            } else {
                // 未知或一般時辰
                solar = Solar.fromYmdH(y, m, d, hour);
            }
        } catch (e) {
            alert('日期不存在，請檢查輸入（如 2/30 不存在）');
            return;
        }

        const lunar = solar.getLunar();

        // 取得年、月柱（精確節氣）
        const yearPillar = lunar.getYearInGanZhiExact();
        const monthPillar = lunar.getMonthInGanZhiExact();

        // 日柱（此時 solar 已正確，若是子時換日，日柱就是次日）
        const dayPillar = lunar.getDayInGanZhi();

        // 時柱
        let timePillar;
        if (hourVal === -1) {
            timePillar = '未知';
        } else {
            // 注意：若是子時換日，我們用到的時柱應基於次日日干，
            // 此處 lunar 已是次日的 lunar，故 getTimeInGanZhi() 正確
            timePillar = lunar.getTimeInGanZhi();
        }

        const full = `${yearPillar} ${monthPillar} ${dayPillar} ${timePillar}`;
        document.getElementById('baziText').innerText = full;
        document.getElementById('result').style.display = 'block';
    }

    function copyBazi() {
        const text = document.getElementById('baziText').innerText;
        if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(() => {
                alert('已複製，可貼上進行八字解盤。');
            }).catch(() => {
                alert('複製失敗，請手動選取。');
            });
        } else {
            // 回退方案：選取文字提示手動複製
            const range = document.createRange();
            range.selectNode(document.getElementById('baziText'));
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            alert('已選取八字，請按 Ctrl+C 複製');
        }
    }
</script>

</body>
</html>
